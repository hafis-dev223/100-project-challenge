<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Switcher</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <audio id="music"></audio>

      <p class="label">MOOD CHECK</p>
      <h1>How are you feeling?</h1>
      <p id="mood-text">Pilih mood lu hari ini 👀</p>

      <div class="mood-buttons">
        <button id="happy">😎 Senang</button>
        <button id="sad">😭 Sedih</button>
        <button id="angry">😡 Marah</button>
        <button id="sleepy">😴 Ngantuk</button>
      </div>

      <p class="footer">Your mood, your vibe.</p>
    </main>
  </body>
</html>
